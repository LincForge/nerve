[project]
name = "linc-nerve"
version = "0.1.0"
description = "LINC Nerve — unified device control platform for mobile and beyond"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
]
requires-python = ">=3.13"
authors = [
    { name = "LINC Innovations" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "adbutils>=2.0",
    "av>=14.0",
    "click>=8.1.7",
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "linc-cli-kit>=0.1",
    "linc-device-kit>=1.0",
    "mcp>=1.0.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "structlog>=25.0",
]

[project.urls]
Homepage = "https://github.com/LincForge/nerve"
Source = "https://github.com/LincForge/nerve"
Issues = "https://github.com/LincForge/nerve/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "bandit>=1.7",
    "pre-commit>=4.0",
    "mutmut>=3.5,<4",
]

[project.scripts]
nerve = "linc_nerve.cli.main:main"
linc-nerve = "linc_nerve.cli.main:main"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
linc_nerve = [
    "mcp/*.yaml",
    "vendor/*",
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
]
"**/test_*.py" = [
    "S101",
]
"**/*_test.py" = [
    "S101",
]
"**/conftest.py" = [
    "S101",
]
"**/testing.py" = [
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = [
    "linc_nerve",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "--ignore=tests/manual",
]
markers = [
    "api_harness: automated stress test exercising every MCP sync function (tests/test_api_harness.py)",
]
filterwarnings = [
    "error",
]

[build-system]
requires = [
    "setuptools>=77.0",
]
build-backend = "setuptools.build_meta"
